[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanogpt-1m"
version = "0.1.0"
description = "A small byte-level GPT built from scratch in PyTorch: NanoGPT-1M (Shakespeare) and NanoQA (question answering)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nanogpt-summary = "nanogpt.cli.summary:main"
nanogpt-train = "nanogpt.cli.train_shakespeare:main"
nanogpt-generate = "nanogpt.cli.generate:main"
nanoqa-build = "nanogpt.cli.build_qa_corpus:main"
nanoqa-train = "nanogpt.cli.train_qa:main"
nanoqa-chat = "nanogpt.cli.chat:main"

[tool.setuptools.packages.find]
include = ["nanogpt*"]

[tool.setuptools.package-data]
"nanogpt.web" = ["templates/*.html"]
